version: 2
project_name: mihomoctl
dist: .release
env:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=local
  - GOENV=off
  - GOWORK=off
  - GOFLAGS=
  - GOEXPERIMENT=
  - GOFIPS140=off
before:
  hooks:
    - bun install --cwd ui --frozen-lockfile
    - bun run --cwd ui build
builds:
  - main: ./cmd/mihomoctl
    targets: [linux_amd64_v1, linux_arm64_v8.0, linux_arm_7]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - '-s -w -buildid= -X main.version=v{{ .Version }}'
archives:
  - formats: [binary]
    name_template: 'mihomoctl-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
checksum:
  name_template: SHA256SUMS
  extra_files: &plugin
    - glob: ui/dist/mihomoctl-ufi.js
release:
  replace_existing_artifacts: false
  replace_existing_draft: false
  mode: keep-existing
  preflight:
    fail_on_error: true
  extra_files: *plugin

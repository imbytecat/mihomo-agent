name: Release
on:
  push:
    tags: ['agent-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache-dependency-path: backend/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - name: Build pinned binaries and plugin
        run: bun run build:release "${GITHUB_REF_NAME#agent-}"
      - run: git diff --exit-code -- backend-release.json
      - run: bun test && shellcheck -x -s sh src/bootstrap.sh backend/internal/agent/network.sh
      - run: npm install --global agent-browser@0.37.1
      - run: agent-browser install --with-deps
      - run: bun tests/ui-smoke.ts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .release/ufi-agent-linux-arm64 .release/ufi-agent-linux-armv7 .release/ufi-mihomo.js .release/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

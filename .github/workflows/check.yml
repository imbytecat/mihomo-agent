name: Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache-dependency-path: agent/go.sum
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run build && bun test
      - run: go test -race ./... && go vet ./...
        working-directory: agent
      - name: Verify real systemd lifecycle on the isolated runner
        run: |
          mkdir -p .build
          cd agent
          go build -o ../.build/mihomo-agent-ci ./cmd/mihomo-agent
          go build -o ../.build/mihomo-core-fixture ./internal/integration/testdata/core
          go test -c -o ../.build/systemd-integration ./internal/integration
          cd ..
          sudo env MIHOMO_SYSTEMD_TEST=1 MIHOMO_TEST_AGENT="$PWD/.build/mihomo-agent-ci" MIHOMO_TEST_CORE="$PWD/.build/mihomo-core-fixture" .build/systemd-integration -test.v -test.timeout=4m
      - run: shellcheck -x -s sh ui/src/transport/ufi-bootstrap.sh agent/internal/platform/network_ufi.sh
      - run: npm install --global agent-browser@0.37.1
      - run: agent-browser install --with-deps
      - run: bun tests/ui-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ufi-mihomo-plugin
          path: dist/ufi-mihomo.js
